[project]
name = "ppt-video-workbench"
version = "0.1.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1,<1",
  "ppt-video-workbench-api",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0.52,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pyinstaller>=6.14,<7",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.16.2,<1",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = [".", "apps/api/src", "peripheral-platform/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backup", ".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Existing release/contract modules contain intentionally dense compatibility
# expressions. Keep their line-length debt explicit while requiring the full
# lint set for all new and modified P02 acceptance tooling.
[tool.ruff.lint.per-file-ignores]
"apps/api/src/workbench/release/manifest.py" = ["E501"]
"scripts/build_program_rc_manifest.py" = ["E501"]
"scripts/personal_use_preflight.py" = ["E501"]
"scripts/verify_candidate_evidence.py" = ["E501"]
"scripts/verify_rc_contracts.py" = ["E501"]
"tests/unit/test_candidate_evidence.py" = ["E501"]
"tests/unit/test_personal_use_preflight.py" = ["E501"]
"tests/unit/test_program_rc_manifest.py" = ["E501"]
"tests/unit/test_rc_contracts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["workbench"]
mypy_path = ["apps/api/src", "peripheral-platform/src"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "peripheral-platform"]

[tool.uv.sources]
ppt-video-workbench-api = { workspace = true }
ppt-video-workbench-peripheral-platform = { workspace = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
