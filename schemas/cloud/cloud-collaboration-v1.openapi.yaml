openapi: 3.1.0
info:
  title: PPT Video Workbench Cloud Collaboration API
  version: 0.1.0-draft
  summary: Local-first collaboration control-plane contract
  description: >-
    Contract draft for identity context, workspaces, immutable project revisions,
    append-only sync operations, content-addressed objects, comments, reviews,
    leases, and remote jobs. All examples are synthetic. This contract does not
    enable upload or start a cloud service by itself.
  license:
    name: Proprietary
servers:
  - url: https://api.example.invalid/v1
    description: Documentation-only placeholder
security:
  - oauth2: [workbench]
tags:
  - name: Identity
  - name: Workspaces
  - name: Projects
  - name: Sync
  - name: Objects
  - name: Collaboration
  - name: Jobs
paths:
  /health:
    get:
      tags: [Identity]
      operationId: getCloudHealth
      summary: Report prototype mode and production-gate state
      security: []
      responses:
        "200":
          description: Cloud control-plane health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, mode, auth_mode, production_gate]
                properties:
                  status:
                    type: string
                    const: ok
                  mode:
                    type: string
                    const: prototype
                  auth_mode:
                    type: string
                    enum: [development, production]
                  production_gate:
                    type: string
                    enum: [ready, blocked]
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Return the current user and effective workspace memberships
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organizations:
    get:
      tags: [Identity]
      operationId: listOrganizations
      summary: List organizations visible through ownership or workspace membership
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Organization page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Identity]
      operationId: createOrganization
      summary: Create an organization owned by the current user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /devices:
    get:
      tags: [Identity]
      operationId: listDevices
      summary: List devices owned by the current user
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Device page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Identity]
      operationId: registerDevice
      summary: Register or refresh one current-user device
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Registered device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    delete:
      tags: [Identity]
      operationId: revokeDevice
      summary: Revoke a current-user device
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List workspaces visible to the current user
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Workspace page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace owned by the current user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: List workspace members
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Member page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Workspaces]
      operationId: addWorkspaceMember
      summary: Add or replace a member role
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMemberRequest"
      responses:
        "201":
          description: Effective membership
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/projects:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects authorized for the current user
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create an empty project or register a genesis revision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project and its current head
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/projects/{projectId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: listProjectRevisions
      summary: List immutable revisions newest first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Revision page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/projects/{projectId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [Projects]
      operationId: getProjectRevision
      summary: Get one immutable revision
      responses:
        "200":
          description: Revision
          headers:
            ETag:
              description: Revision content hash
              schema:
                $ref: "#/components/schemas/Sha256"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/projects/{projectId}/operations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Sync]
      operationId: listSyncOperations
      summary: Read operations after an opaque cursor
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Operation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Sync]
      operationId: appendSyncOperation
      summary: Append an idempotent operation and advance project head
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncOperation"
      responses:
        "201":
          description: Operation accepted and revision created
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspaces/{workspaceId}/projects/{projectId}/conflicts:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Sync]
      operationId: listSyncConflicts
      summary: List structured offline-edit conflicts for manual resolution
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Conflict page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncConflictPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/projects/{projectId}/conflicts/{conflictId}/resolve:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - name: conflictId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    post:
      tags: [Sync]
      operationId: resolveSyncConflict
      summary: Resolve a structured conflict against the expected current head
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveSyncConflictRequest"
      responses:
        "200":
          description: Resolved conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncConflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/members/{actorId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: actorId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceMember
      summary: Revoke a non-owner workspace membership
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked membership generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRevocation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspaces/{workspaceId}/projects/{projectId}/objects/uploads:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Objects]
      operationId: initiateObjectUpload
      summary: Validate an object declaration and create a short-lived upload session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateUploadRequest"
      responses:
        "201":
          description: Upload session
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspaces/{workspaceId}/projects/{projectId}/objects/uploads/{uploadId}/complete:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - name: uploadId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    post:
      tags: [Objects]
      operationId: completeObjectUpload
      summary: Verify uploaded bytes and create a project-scoped object reference
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "201":
          description: Verified object reference
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/service-accounts:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Identity]
      operationId: listServiceAccounts
      summary: List workspace service accounts as an owner or administrator
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Service account page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Identity]
      operationId: createServiceAccount
      summary: Create a workspace-scoped service account
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountRequest"
      responses:
        "201":
          description: Service account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/service-accounts/{serviceAccountId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: serviceAccountId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    delete:
      tags: [Identity]
      operationId: disableServiceAccount
      summary: Disable a workspace service account
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Disabled service account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/projects/{projectId}/objects/uploads/{uploadId}/parts/{partNumber}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - name: uploadId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
      - name: partNumber
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10000
    put:
      tags: [Objects]
      operationId: uploadObjectPart
      summary: Stage one bounded upload part
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Staged part digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedPart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/projects/{projectId}/objects/{objectId}/download:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - name: objectId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Sha256"
    post:
      tags: [Objects]
      operationId: authorizeObjectDownload
      summary: Create a short-lived download authorization
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Download authorization
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadAuthorization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspaces/{workspaceId}/projects/{projectId}/objects/{objectId}/content:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - name: objectId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Sha256"
    get:
      tags: [Objects]
      operationId: downloadObjectContent
      summary: Stream verified project-scoped object bytes
      responses:
        "200":
          description: Object content
          headers:
            ETag:
              schema:
                $ref: "#/components/schemas/Sha256"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /workspaces/{workspaceId}/projects/{projectId}/comments:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Collaboration]
      operationId: listComments
      summary: List comments visible on the project
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Comment page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Collaboration]
      operationId: createComment
      summary: Create a plain-text comment anchored to a revision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/projects/{projectId}/reviews:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Collaboration]
      operationId: listReviews
      summary: List current and expired reviews for the project
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Review page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Collaboration]
      operationId: submitReview
      summary: Record an approval or requested changes for one revision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReviewRequest"
      responses:
        "201":
          description: Review recorded
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/projects/{projectId}/lease:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    put:
      tags: [Collaboration]
      operationId: acquireOrRenewProjectLease
      summary: Acquire or renew a bounded advisory editing lease
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseRequest"
      responses:
        "200":
          description: Active lease
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Collaboration]
      operationId: releaseProjectLease
      summary: Release a lease or force release it with an audited administrator reason
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: reason
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        "200":
          description: Lease release audit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseRelease"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/executors:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Jobs]
      operationId: listExecutors
      summary: List workspace-scoped executor registrations
      responses:
        "200":
          description: Executor registrations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: "#/components/schemas/ExecutorRegistration"
                  next_cursor:
                    oneOf:
                      - type: string
                        minLength: 1
                        maxLength: 2048
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Jobs]
      operationId: registerExecutor
      summary: Register a bounded built-in executor capability snapshot
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutorRegisterRequest"
      responses:
        "201":
          description: Executor registration
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorRegistration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/projects/{projectId}/jobs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Jobs]
      operationId: listRemoteJobs
      summary: List remote jobs for the project
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Job page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Jobs]
      operationId: createRemoteJob
      summary: Create a remote job against an immutable revision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "202":
          description: Job queued
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspaces/{workspaceId}/projects/{projectId}/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - name: jobId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    get:
      tags: [Jobs]
      operationId: getRemoteJob
      summary: Get remote job state and normalized output references
      responses:
        "200":
          description: Remote job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Jobs]
      operationId: cancelRemoteJob
      summary: Request cancellation of a queued or running job
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancellation requested
          headers:
            Operation-Id:
              $ref: "#/components/headers/OperationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspaces/{workspaceId}/projects/{projectId}/jobs/{jobId}/claim:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - name: jobId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    post:
      tags: [Jobs]
      operationId: claimRemoteJobAttempt
      summary: Claim a queued or expired built-in job with a bounded executor lease
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimJobRequest"
      responses:
        "200":
          description: Attempt lease and one short-lived capability token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /workspaces/{workspaceId}/projects/{projectId}/jobs/{jobId}/attempts/{attemptId}/input:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - name: jobId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
      - name: attemptId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    get:
      tags: [Jobs]
      operationId: getRemoteJobAttemptInput
      summary: Read immutable input using the current attempt capability token
      parameters:
        - $ref: "#/components/parameters/AttemptToken"
      responses:
        "200":
          description: Immutable attempt input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAttemptInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspaces/{workspaceId}/projects/{projectId}/jobs/{jobId}/result:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProjectId"
      - name: jobId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    post:
      tags: [Jobs]
      operationId: reportRemoteJobResult
      summary: Verify and publish one executor result attempt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AttemptToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobResultReport"
      responses:
        "200":
          description: Job result accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Authorization Code with PKCE; desktop clients must use the system browser.
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.invalid/oauth2/authorize
          tokenUrl: https://identity.example.invalid/oauth2/token
          scopes:
            workbench: Access resources granted by workspace membership
  headers:
    OperationId:
      description: Stable identifier for the end-to-end user intent
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID scoped to tenant and operation kind; reused only for the same semantic side effect.
      schema:
        $ref: "#/components/schemas/Uuid"
    AttemptToken:
      name: X-Attempt-Token
      in: header
      required: true
      description: Short-lived capability bound to one job attempt and its staging boundary.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    DeviceId:
      name: X-Device-ID
      in: header
      required: false
      description: Registered desktop device identity; revoked devices are rejected when supplied.
      schema:
        $ref: "#/components/schemas/Uuid"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque, scope-bound pagination cursor
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Unauthorized:
      description: Authentication is missing, expired, or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The authenticated principal is not allowed to perform this action
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource does not exist or is not visible to the current principal
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Idempotency conflict, stale base revision, active lease, or invalid state transition
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Request failed schema or semantic validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Declared or received content exceeds policy
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServerError:
      description: An unexpected integrity or service failure occurred
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Tenant, principal, or operation quota exceeded
      headers:
        Retry-After:
          description: Delay in seconds before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Timestamp:
      type: string
      format: date-time
      pattern: "Z$"
    Sha256:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
    Role:
      type: string
      enum: [owner, admin, editor, reviewer, viewer]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, operation_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,99}$"
        operation_id:
          $ref: "#/components/schemas/Uuid"
        retryable:
          type: boolean
        user_action:
          type: string
          maxLength: 500
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user_id, display_name, memberships]
      properties:
        user_id:
          $ref: "#/components/schemas/Uuid"
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        memberships:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Membership"
        devices:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Device"
    Organization:
      type: object
      additionalProperties: false
      required: [organization_id, name, created_at, created_by]
      properties:
        organization_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          $ref: "#/components/schemas/Uuid"
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    Device:
      type: object
      additionalProperties: false
      required: [device_id, user_id, name, platform, status, registered_at, last_seen_at]
      properties:
        device_id:
          $ref: "#/components/schemas/Uuid"
        user_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        platform:
          type: string
          enum: [windows, macos, linux]
        status:
          type: string
          enum: [active, revoked]
        registered_at:
          $ref: "#/components/schemas/Timestamp"
        last_seen_at:
          $ref: "#/components/schemas/Timestamp"
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [name, platform]
      properties:
        device_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        platform:
          type: string
          enum: [windows, macos, linux]
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [service_account_id, workspace_id, name, status, created_at, created_by]
      properties:
        service_account_id:
          $ref: "#/components/schemas/Uuid"
        workspace_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [active, disabled]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          $ref: "#/components/schemas/Uuid"
    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    Executor:
      type: object
      additionalProperties: false
      required: [executor_id, workspace_id, name, status, capabilities, runtime_fingerprint, last_seen_at]
      properties:
        executor_id:
          $ref: "#/components/schemas/Uuid"
        workspace_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [online, draining, offline, revoked]
        capabilities:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_.-]{0,99}$"
        runtime_fingerprint:
          $ref: "#/components/schemas/Sha256"
        last_seen_at:
          $ref: "#/components/schemas/Timestamp"
    ExecutorRegisterRequest:
      type: object
      additionalProperties: false
      required: [platform, capabilities, region]
      properties:
        executor_id:
          $ref: "#/components/schemas/Uuid"
        platform:
          type: string
          enum: [windows, macos, linux]
        capabilities:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_.-]{0,99}$"
        region:
          type: string
          minLength: 1
          maxLength: 64
        gpu_label:
          type: string
          minLength: 1
          maxLength: 128
        office_capability:
          type: string
          enum: [microsoft_office, libreoffice, none]
          default: none
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 900
          default: 120
        capability_snapshot:
          type: object
          maxProperties: 128
          additionalProperties: true
    ExecutorRegistration:
      type: object
      additionalProperties: false
      required:
        - executor_id
        - workspace_id
        - platform
        - capabilities
        - region
        - office_capability
        - status
        - expires_at
        - capability_snapshot
      properties:
        executor_id:
          $ref: "#/components/schemas/Uuid"
        workspace_id:
          $ref: "#/components/schemas/Uuid"
        platform:
          type: string
          enum: [windows, macos, linux]
        capabilities:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_.-]{0,99}$"
        region:
          type: string
          minLength: 1
          maxLength: 64
        gpu_label:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
            - type: "null"
        office_capability:
          type: string
          enum: [microsoft_office, libreoffice, none]
        status:
          type: string
          enum: [active, expired]
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        capability_snapshot:
          type: object
          maxProperties: 128
          additionalProperties: true
    Membership:
      type: object
      additionalProperties: false
      required: [workspace_id, user_id, role, membership_version, created_at]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Uuid"
        user_id:
          $ref: "#/components/schemas/Uuid"
        role:
          $ref: "#/components/schemas/Role"
        membership_version:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
    Workspace:
      type: object
      additionalProperties: false
      required: [workspace_id, organization_id, name, created_at, created_by]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Uuid"
        organization_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          $ref: "#/components/schemas/Uuid"
        role:
          $ref: "#/components/schemas/Role"
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        organization_id:
          $ref: "#/components/schemas/Uuid"
    UpsertMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id:
          $ref: "#/components/schemas/Uuid"
        role:
          $ref: "#/components/schemas/Role"
    MemberRevocation:
      type: object
      additionalProperties: false
      required: [workspace_id, user_id, status, membership_version]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Uuid"
        user_id:
          $ref: "#/components/schemas/Uuid"
        status:
          const: revoked
        membership_version:
          type: integer
          minimum: 2
    Project:
      type: object
      additionalProperties: false
      required: [project_id, workspace_id, name, head_revision_id, created_at, updated_at]
      properties:
        project_id:
          $ref: "#/components/schemas/Uuid"
        workspace_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 300
        head_revision_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
        genesis_revision:
          $ref: "#/components/schemas/ProjectRevision"
    ObjectRef:
      $ref: "./cloud-object-ref-v1.schema.json"
    ProjectRevision:
      $ref: "./cloud-project-revision-v1.schema.json"
    SyncOperation:
      $ref: "./cloud-sync-operation-v1.schema.json"
    OperationResult:
      type: object
      additionalProperties: false
      required: [operation_id, accepted_attempt_id, revision, cursor, conflict]
      properties:
        operation_id:
          $ref: "#/components/schemas/Uuid"
        accepted_attempt_id:
          $ref: "#/components/schemas/Uuid"
        revision:
          $ref: "#/components/schemas/ProjectRevision"
        cursor:
          type: string
          minLength: 1
          maxLength: 2048
        conflict:
          oneOf:
            - $ref: "#/components/schemas/SyncConflict"
            - type: "null"
    SyncConflict:
      type: object
      additionalProperties: false
      required:
        - conflict_id
        - project_id
        - operation_id
        - base_revision_id
        - head_revision_id
        - kind
        - paths
        - status
        - created_at
      properties:
        conflict_id:
          $ref: "#/components/schemas/Uuid"
        project_id:
          $ref: "#/components/schemas/Uuid"
        operation_id:
          $ref: "#/components/schemas/Uuid"
        base_revision_id:
          $ref: "#/components/schemas/Uuid"
        head_revision_id:
          $ref: "#/components/schemas/Uuid"
        kind:
          type: string
          enum: [same_field, delete_modify, page_order, incompatible_schema]
        paths:
