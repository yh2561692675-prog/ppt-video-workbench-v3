name: platform-contracts

on:
  pull_request:
  push:
    branches: [codex/program-integration-v1]

permissions:
  contents: read

jobs:
  contract-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -e "apps/api[platform]" -e peripheral-platform pytest ruff mypy
      - name: Platform contract tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "apps/api/src"
          python scripts/generate_cloud_client.py --check
          python -m pytest tests/platform tests/unit/platform_foundation -q
          python -m ruff check apps/api/src/workbench/platform tests/platform tests/unit/platform_foundation
          python -m mypy apps/api/src/workbench/platform

  signed-installer-evidence:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Require platform packaging evidence
        shell: bash
        run: |
          test -f docs/platform/cross-platform-release-matrix.md
          evidence_root="artifacts/platform/${{ matrix.platform }}"
          for artifact in install.json upgrade.json rollback.json uninstall.json runtime.json signature.json; do
            test -s "$evidence_root/$artifact"
          done
          python scripts/verify_platform_evidence.py \
            --root . \
            --platform "${{ matrix.platform }}"
          echo "Verified real signing, install, upgrade, rollback and uninstall evidence for ${{ matrix.platform }}."
