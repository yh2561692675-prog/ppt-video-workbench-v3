name: platform-contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -e apps/api -e peripheral-platform pytest ruff mypy
      - name: Platform contract tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "apps/api/src"
          python -m pytest tests/platform tests/unit/platform_foundation -q
          python -m ruff check apps/api/src/workbench/platform tests/platform tests/unit/platform_foundation
          python -m mypy apps/api/src/workbench/platform

  signed-installer-evidence:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Require platform packaging evidence
        shell: bash
        run: |
          test -f docs/platform/cross-platform-release-matrix.md
          echo "Real signing, install, upgrade, rollback and uninstall evidence is required on $RUNNER_OS."
