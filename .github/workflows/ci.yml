name: CI

on:
  push:
    branches: [codex/program-integration-v1]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libreoffice fonts-noto-cjk-extra
      - if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg libreoffice-fresh -y --no-progress
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy apps/api/src
      - if: runner.os != 'Windows'
        run: uv run pytest
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LibreOffice\program;$env:PATH"
          uv run pytest
      - run: pnpm install --frozen-lockfile
      - if: runner.os != 'Windows'
        run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: pnpm exec playwright install ffmpeg
      - run: pnpm check
      - run: pnpm e2e
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/run-web-release-gate.ps1 -CandidateId ci-${{ github.sha }}
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}
          if-no-files-found: error
          retention-days: 30
          path: |
            test-results/
            playwright-report/
