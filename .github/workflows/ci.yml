name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libreoffice fonts-noto-cjk-extra
      - if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg libreoffice-fresh -y --no-progress
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy apps/api/src
      - if: runner.os != 'Windows'
        run: uv run pytest
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LibreOffice\program;$env:PATH"
          uv run pytest
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm e2e
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/run-web-release-gate.ps1 -CandidateId ci-${{ github.sha }}
