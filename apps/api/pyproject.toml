[project]
name = "ppt-video-workbench-api"
version = "0.1.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1,<1",
  "faster-whisper>=1.2,<2",
  "cryptography>=50.0.0,<51",
  "httpx>=0.28,<1",
  "ppt-video-workbench-peripheral-platform",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "starlette==1.3.1",
  "uvicorn>=0.35,<1",
]

[tool.uv.sources]
ppt-video-workbench-peripheral-platform = { workspace = true }

[project.optional-dependencies]
ocr = [
    "numpy>=2,<3",
    "paddleocr>=3.2,<4",
    "paddlepaddle>=3.2,<4",
]
platform = [
    "keyring>=25,<26",
    "secretstorage>=3.3,<4; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]
